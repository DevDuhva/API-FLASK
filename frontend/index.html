<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Biblioteca</h1>

        <div class="busca">

            <input
                type="text"
                id="campoBusca"
                placeholder="Buscar livro..."
            >

            <button onclick="buscarLivros()">
                Buscar
            </button>

        </div>


        <form id="formLivro">

            <input
                type="text"
                id="titulo"
                placeholder="Título"
                required
            >

            <input
                type="text"
                id="autor"
                placeholder="Autor"
                required
            >

            <input
                type="text"
                id="categoria"
                placeholder="Categoria"
            >

            <input
                type="number"
                id="ano"
                placeholder="Ano"
            >

            <input
                type="number"
                id="avaliacao"
                placeholder="Avaliação"
            >

            <textarea
                id="descricao"
                placeholder="Descrição"
            ></textarea>

            <input
                type="text"
                id="imagem"
                placeholder="URL da capa"
            >

            <button type="submit">
                Salvar Livro
            </button>

        </form>

        <p id="mensagem"></p>

        <div id="listaLivros"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
